{% extends "base.html" %}
{% block content %}
<div class="page-head">
  <h1>Регистрация</h1>
  <p class="page-sub muted">Заполните заявку на доступ. После проверки администратор одобрит вашу учётную запись.</p>
</div>

{% if error %}
<div class="notice err">
  <span>{{ error }}</span>
</div>
{% endif %}

<form method="post" action="/register" class="auth-form">
  <label class="field">
    <span class="field-label">Телефон</span>
    <input type="tel" name="phone" required placeholder="+7 (999) 123-45-67" autocomplete="tel">
  </label>

  <label class="field">
    <span class="field-label">ФИО</span>
    <input type="text" name="full_name" required placeholder="Иванов Иван Иванович" autocomplete="name">
  </label>

  <label class="field">
    <span class="field-label">Пароль</span>
    <input type="password" name="password" required minlength="6" placeholder="Не менее 6 символов" autocomplete="new-password">
  </label>

  <label class="field">
    <span class="field-label">Комментарий (необязательно)</span>
    <textarea name="comment" rows="3" placeholder="Напишите, кто вы и зачем нужен доступ"></textarea>
  </label>

  <button type="submit">Отправить заявку</button>
  <p class="muted" style="margin-top:16px">Уже есть учётная запись? <a href="/user-login">Войти</a></p>
</form>

<style>
.auth-form {
  max-width: 480px;
  margin: 32px 0;
}
.auth-form .field {
  display: flex;
  flex-direction: column;
  margin-bottom: 16px;
}
.auth-form .field-label {
  margin-bottom: 6px;
  font-weight: 500;
}
.auth-form input,
.auth-form textarea {
  padding: 10px 12px;
  border: 1px solid #2a2f3a;
  border-radius: 6px;
  background: #0f131c;
  color: #e5e7eb;
  font-size: 15px;
}
.auth-form input:focus,
.auth-form textarea:focus {
  outline: none;
  border-color: #38bdf8;
}
.auth-form button {
  width: 100%;
  padding: 12px;
  background: #38bdf8;
  color: #05070c;
  border: none;
  border-radius: 999px;
  font-weight: 600;
  font-size: 15px;
  cursor: pointer;
}
.auth-form button:hover {
  background: #0ea5e9;
}
</style>
{% endblock %}
