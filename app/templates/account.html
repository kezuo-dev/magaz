{% extends "base.html" %}
{% block content %}
<div class="page-header">
  <h1>Профиль</h1>
</div>

{% if notice %}
<div class="notice ok"><span>{{ notice }}</span></div>
{% endif %}
{% if error %}
<div class="notice err"><span>{{ error }}</span></div>
{% endif %}

<div class="account-grid">
  <div class="account-card">
    <div class="account-card-header">
      <div class="account-avatar">
        <span class="account-avatar-icon">👤</span>
      </div>
      <div class="account-info">
        <h2 class="account-name">{{ request.state.user.full_name }}</h2>
        <p class="account-phone">{{ request.state.user.phone_pretty }}</p>
        <span class="account-role">{{ request.state.user.role_label }}</span>
      </div>
    </div>
  </div>

  <div class="account-card">
    <h3 class="account-card-title">Смена пароля</h3>
    <form method="post" action="/account/password" class="account-form">
      <label class="field">
        <span class="field-label">Текущий пароль</span>
        <input type="password" name="current_password" required autocomplete="current-password">
      </label>

      <div class="field">
        <label class="field-label" for="new-password">Новый пароль</label>
        <div class="field-peek">
          <input type="password" name="new_password" id="new-password" required
                 minlength="6" placeholder="Не менее 6 символов" autocomplete="new-password">
          <button type="button" class="peek-btn" data-peek="new-password"
                  aria-label="Показать пароль" aria-pressed="false" title="Показать пароль">
            <span class="peek-icon">👁</span>
          </button>
        </div>
      </div>

      <label class="field">
        <span class="field-label">Повторите новый пароль</span>
        <input type="password" name="repeat_password" required minlength="6" autocomplete="new-password">
      </label>

      <button type="submit" class="btn-primary">Сменить пароль</button>
    </form>
  </div>
</div>

<script>
  document.querySelectorAll(".peek-btn").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var input = document.getElementById(btn.dataset.peek);
      if (!input) return;
      var shown = input.type === "text";
      input.type = shown ? "password" : "text";
      btn.setAttribute("aria-pressed", shown ? "false" : "true");
      btn.setAttribute("aria-label", shown ? "Показать пароль" : "Скрыть пароль");
      btn.title = shown ? "Показать пароль" : "Скрыть пароль";
      btn.classList.toggle("is-on", !shown);
      input.focus();
    });
  });
</script>
{% endblock %}
